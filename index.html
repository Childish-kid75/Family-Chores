<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Chores</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1c2030;--muted:#6b7285;--accent:#4f46e5;--accent-t:#fff;--line:#e3e6ef;--done:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c202c;--text:#eceef6;--muted:#9097ad;--accent:#818cf8;--accent-t:#12141c;--line:#2b3040;--done:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:1.4rem;margin:4px 0 2px}.sub{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.primary{width:100%;margin-top:14px;background:var(--accent);color:var(--accent-t);font-weight:600}
.ghost{background:transparent;color:var(--muted);padding:6px 10px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px}
.chore{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.chore:last-child{border-bottom:0}.t{flex:1;min-width:0}.t b{display:block;overflow-wrap:anywhere}.t span{color:var(--muted);font-size:.85rem}
.chore.done b{text-decoration:line-through;color:var(--muted)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;color:var(--accent-t)}
.chore.done .chk{background:var(--done);border-color:var(--done)}
#msg{color:var(--muted);font-size:.85rem;text-align:center;margin:6px 0}
.hidden{display:none}
</style>
</head>
<body>
<h1>Family Chores</h1>
<div class="sub" id="who">Sign in to see and add chores.</div>

<div id="login" class="card"><button class="primary" id="signin" style="margin-top:0">Sign in with Google</button></div>

<div id="app" class="hidden">
  <div class="card">
    <label for="title">Chore</label><input id="title" maxlength="80" placeholder="e.g. Wash the dishes">
    <div class="row">
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div><label for="time">Time</label><input id="time" type="time"></div>
    </div>
    <label for="repeat">Repeat</label>
    <select id="repeat"><option value="">Just once</option><option value="DAILY">Every day</option><option value="WEEKLY">Every week</option></select>
    <button class="primary" id="add">Add chore</button>
  </div>
  <div id="msg"></div>
  <div id="list"></div>
  <button class="primary" id="ics">Download calendar file (.ics)</button>
  <button class="ghost" id="signout" style="width:100%;margin-top:8px">Sign out</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1. PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web app)
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCafXaRK-pH686WvSiH1uDcxfuKYm54GiM",
  authDomain: "family-chores-b25c2.firebaseapp.com",
  databaseURL: "https://family-chores-b25c2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "family-chores-b25c2",
  storageBucket: "family-chores-b25c2.firebasestorage.app",
  messagingSenderId: "865989335618",
  appId: "1:865989335618:web:a6040e132adefc4b20abdb",
  measurementId: "G-FL3ZY5W5Y6"
};

const $ = i => document.getElementById(i);
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
let chores = [], unsub = null;
const pad = n => (n<10?'0':'')+n;
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
$('date').value = iso(new Date());

$('signin').onclick = () => signInWithPopup(auth,new GoogleAuthProvider()).catch(e => $('who').textContent = 'Sign-in failed: '+e.code);
$('signout').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  $('login').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  if (!user) { $('who').textContent = 'Sign in to see and add chores.'; return; }
  $('who').textContent = 'Signed in as ' + user.email;
  unsub = onSnapshot(query(collection(db,'chores'), orderBy('date')),
    snap => { chores = snap.docs.map(d => ({id:d.id, ...d.data()})); $('msg').textContent=''; render(); },
    () => $('msg').textContent = "Can't load chores. Is your email in firestore.rules?");
});

$('add').onclick = async () => {
  const title = $('title').value.trim();
  if (!title || !$('date').value) { $('msg').textContent = 'Add a chore name and date.'; return; }
  try {
    await addDoc(collection(db,'chores'), {title, date:$('date').value, time:$('time').value, repeat:$('repeat').value,
      done:false, by:auth.currentUser.email, created:serverTimestamp()});
    $('title').value=''; $('time').value=''; $('msg').textContent='Added ✓';
  } catch(e) { $('msg').textContent = 'Could not save: '+e.code; }
};

function label(s){
  const t=new Date(), tm=new Date(); tm.setDate(t.getDate()+1);
  if (s===iso(t)) return 'Today'; if (s===iso(tm)) return 'Tomorrow';
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}

function render(){
  const l=$('list'); l.textContent='';
  if (!chores.length) { $('msg').textContent='No chores yet. Add the first one above.'; return; }
  const groups={};
  [...chores].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).forEach(c => (groups[c.date] ||= []).push(c));
  for (const d of Object.keys(groups)) {
    const h=document.createElement('h2'); h.textContent=label(d); l.appendChild(h);
    const card=document.createElement('div'); card.className='card'; card.style.padding='0';
    groups[d].forEach(c => {
      const r=document.createElement('div'); r.className='chore'+(c.done?' done':'');
      const b=document.createElement('button'); b.className='chk'; b.textContent=c.done?'✓':'';
      b.onclick=()=>updateDoc(doc(db,'chores',c.id),{done:!c.done});
      const t=document.createElement('div'); t.className='t';
      const n=document.createElement('b'); n.textContent=c.title;
      const s=document.createElement('span');
      s.textContent=[c.time||'Any time', c.repeat&&c.repeat.toLowerCase(), c.by&&'by '+c.by.split('@')[0]].filter(Boolean).join(' · ');
      t.append(n,s);
      const x=document.createElement('button'); x.className='ghost'; x.textContent='✕';
      x.onclick=()=>{
        if (x.dataset.sure!=='1') { x.dataset.sure='1'; x.textContent='Delete?'; x.style.color='#dc2626';
          setTimeout(()=>{x.dataset.sure='';x.textContent='✕';x.style.color='';},3000); return; }
        deleteDoc(doc(db,'chores',c.id));
      };
      r.append(b,t,x); card.appendChild(r);
    });
    l.appendChild(card);
  }
}

$('ics').onclick = () => {
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Chores//EN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  chores.forEach(c => {
    const [y,m,d]=c.date.split('-'); const day=y+m+d;
    out.push('BEGIN:VEVENT','UID:'+c.id+'@family-chores','DTSTAMP:'+stamp);
    if (c.time) { const [hh,mm]=c.time.split(':'); const e=new Date(+y,+m-1,+d,+hh+1,+mm);
      out.push('DTSTART:'+day+'T'+hh+mm+'00','DTEND:'+e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate())+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'); }
    else out.push('DTSTART;VALUE=DATE:'+day);
    out.push('SUMMARY:'+c.title.replace(/[\\;,]/g,' '));
    if (c.repeat) out.push('RRULE:FREQ='+c.repeat);
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out.join('\r\n')],{type:'text/calendar'}));
  a.download='chores.ics'; a.click();
};
</script>
</body>
</html>
